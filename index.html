<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para o Amor da Minha Vida ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="hearts"></div>

    <section id="inicio">

        <img src="img/images.jpg" class="foto">

        <h1>Para o amor da minha vida ❤️</h1>

        <p>
            Desde que você entrou na minha vida tudo ficou mais bonito.
            Você é a pessoa que faz meus dias felizes e quero viver todos os momentos ao seu lado.
        </p>

        <button id="abrir">
            Tenho uma pergunta...
        </button>

    </section>

    <section id="pedido">

        <h1>❤️ Você aceita namorar comigo? ❤️</h1>

        <div class="botoes">

            <button id="sim">SIM ❤️</button>

            <button id="nao">NÃO 😅</button>

        </div>

    </section>

    <section id="final">

        <h1>EU SABIA!! ❤️</h1>

        <img id="gato" src="img/frame1.png">

        <h2>Agora somos oficialmente namorados ❤️</h2>

    </section>

    <audio id="musica" src="audio/musica.mp3"></audio>

    <script src="script.js"></script>

</body>

</html>
